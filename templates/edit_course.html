{% extends 'base.html' %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-8">
        <div class="card shadow-sm">
            <div class="card-header bg-dark text-white">
                <h4 class="mb-0">{% if course %}Modify Course Architecture{% else %}Create New Course Record{% endif %}</h4>
            </div>
            <div class="card-body">
                <form method="POST">
                    <div class="row g-3 mb-3">
                        <div class="col-md-4">
                            <label class="form-label fw-bold">Course Code</label>
                            <input type="text" name="course_code" class="form-control" value="{{ course.course_code if course else '' }}" required placeholder="e.g., ECE211">
                        </div>
                        <div class="col-md-8">
                            <label class="form-label fw-bold">Course Name</label>
                            <input type="text" name="course_name" class="form-control" value="{{ course.name if course else '' }}" required placeholder="e.g., Signal & Systems">
                        </div>
                    </div>

                    <div class="row g-3 mb-3">
                        <div class="col-md-4">
                            <label class="form-label fw-bold">Credit Hours</label>
                            <input type="number" name="credit_hours" class="form-control" value="{{ course.credit_hours if course else 3 }}" required min="1" max="6">
                        </div>
                        <div class="col-md-4">
                            <label class="form-label fw-bold">Year Level</label>
                            <input type="number" name="year_level" class="form-control" value="{{ course.year_level if course else 1 }}" required min="1" max="5">
                        </div>
                        <div class="col-md-4">
                            <label class="form-label fw-bold">Semester</label>
                            <input type="number" name="semester_offered" class="form-control" value="{{ course.semester_offered if course else 1 }}" required min="1" max="2">
                        </div>
                    </div>

                    <div class="mb-3">
                        <label class="form-label fw-bold">Department Scope (Select multiple if cross-listed)</label>
                        <select name="department_ids" class="form-select" multiple size="3" required>
                            {% for dept in departments %}
                                <option value="{{ dept.id }}" {% if dept.id in current_dept_ids %}selected{% endif %}>
                                    {{ dept.name }} ({{ dept.code }})
                                </option>
                            {% endfor %}
                        </select>
                        <div class="form-text small">Hold Ctrl (or Cmd) to select multiple scopes. The first chosen acts as primary.</div>
                    </div>

                    <div class="mb-3">
                        <label class="form-label fw-bold">Applicable Streams (Leave completely empty if common to all ECE fields)</label>
                        <select name="stream_ids" class="form-select" multiple size="3">
                            {% for stream in streams %}
                                <option value="{{ stream.id }}" {% if stream.id in current_stream_ids %}selected{% endif %}>
                                    {{ stream.name }}
                                </option>
                            {% endfor %}
                        </select>
                    </div>

                    <div class="mb-3">
                        <label class="form-label fw-bold">Special Custom Criteria Flag</label>
                        <input type="text" name="special_requirement" class="form-control" value="{{ course.special_requirement if (course and course.special_requirement) else '' }}" placeholder="e.g., Graduation Project, Interdisciplinary">
                    </div>

                    <div class="mb-4 form-check form-switch">
                        <input class="form-check-input" type="checkbox" name="is_droppable" id="is_droppable" {% if not course or course.is_droppable %}checked{% endif %}>
                        <label class="form-check-label fw-bold" for="is_droppable">Allow Student Drops (Droppable Status)</label>
                    </div>

                    <div class="d-flex justify-content-between">
                        <a href="/" class="btn btn-outline-secondary">Discard Changes</a>
                        <button type="submit" class="btn btn-success">{% if course %}Save Adjustments{% else %}Create Course Record{% endif %}</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
