{% extends 'base.html' %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-8 col-lg-6">
        <div class="card shadow-sm">
            <div class="card-header bg-dark text-white">
                <h4 class="mb-0">{{ 'Edit' if course else 'Add New' }} Course</h4>
            </div>
            <div class="card-body">
                <form method="POST">
                    <div class="mb-3">
                        <label for="course_code" class="form-label font-weight-bold">Course Code</label>
                        <input type="text" class="form-control" id="course_code" name="course_code" 
                               value="{{ course.course_code if course else '' }}" required placeholder="e.g., ECEg3201">
                    </div>

                    <div class="mb-3">
                        <label for="course_name" class="form-label">Course Name</label>
                        <input type="text" class="form-control" id="course_name" name="course_name" 
                               value="{{ course.course_name if course else '' }}" required placeholder="e.g., Database Systems">
                    </div>

                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label for="credit_hours" class="form-label">Credit Hours</label>
                            <input type="number" class="form-control" id="credit_hours" name="credit_hours" 
                                   value="{{ course.credit_hours if course else 3 }}" min="1" max="10" required>
                        </div>
                        <div class="col-md-6 mb-3">
                            <label for="is_droppable" class="form-label d-block">Droppable?</label>
                            <div class="form-check form-switch mt-2">
                                <input class="form-check-input" type="checkbox" id="is_droppable" name="is_droppable" 
                                       {% if not course or course.is_droppable %}checked{% endif %}>
                                <label class="form-check-label" for="is_droppable">Allow drop</label>
                            </div>
                        </div>
                    </div>

                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label for="year_level" class="form-label">Year Level</label>
                            <input type="number" class="form-control" id="year_level" name="year_level" 
                                   value="{{ course.year_level if course else 1 }}" min="1" max="5" required>
                        </div>
                        <div class="col-md-6 mb-3">
                            <label for="semester_offered" class="form-label">Semester Offered</label>
                            <select class="form-select" id="semester_offered" name="semester_offered" required>
                                <option value="1" {% if course and course.semester_offered == 1 %}selected{% endif %}>Semester 1</option>
                                <option value="2" {% if course and course.semester_offered == 2 %}selected{% endif %}>Semester 2</option>
                            </select>
                        </div>
                    </div>

                    <div class="mb-3">
                        <label for="department_id" class="form-label">Department Scope</label>
                        <select class="form-select" id="department_id" name="department_id" required>
                            {% for dept in departments %}
                                <option value="{{ dept.id }}" {% if course and course.department_id == dept.id %}selected{% endif %}>
                                    {{ dept.name }} ({{ dept.code }})
                                </option>
                            {% endfor %}
                        </select>
                    </div>

                    <div class="mb-4">
                        <label for="stream_id" class="form-label">Stream Specificity</label>
                        <select class="form-select" id="stream_id" name="stream_id">
                            <option value="">Common (Shared across all Streams)</option>
                            {% for stream in streams %}
                                <option value="{{ stream.id }}" {% if course and course.stream_id == stream.id %}selected{% endif %}>
                                    {{ stream.name }}
                                </option>
                            {% endfor %}
                        </select>
                        <small class="text-muted">Keep blank if this course is part of the common block curriculum.</small>
                    </div>

                    <div class="d-flex justify-content-between">
                        <a href="/" class="btn btn-outline-secondary">Cancel</a>
                        <button type="submit" class="btn btn-success">{{ 'Update Course' if course else 'Create Course' }}</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
